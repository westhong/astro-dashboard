name: update-report

on:
  # 只作手動 deterministic fallback；正式每小時發佈由 Hermes 分析 job 負責。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install skyfield requests -r requirements-smoke.txt

      - name: Preflight smoke runtime
        run: python -c "import numpy, scipy, tifffile"

      - name: Build report JSON（暫時性失敗自動重試）
        shell: bash
        run: |
          set -u -o pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Build attempt ${attempt}/${max_attempts}"
            if python backend/build_report.py; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Build failed after ${max_attempts} attempts (exit ${status})."
              exit "$status"
            fi

            delay=$((60 * (2 ** (attempt - 1))))
            echo "Build failed (exit ${status}); retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Commit updated data
        run: |
          git config user.name "astro-dashboard-bot"
          git config user.email "astro-dashboard-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "冇變化，唔 commit"
          else
            git commit -m "data: report update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
