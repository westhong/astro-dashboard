<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="銀河儀表板">
<title>🌌 銀河儀表板</title>
<style>
  :root {
    --bg: #0a0e1a;
    --card: rgba(255,255,255,0.045);
    --card-border: rgba(255,255,255,0.09);
    --text: #e8ecf4;
    --text-dim: #8b93a7;
    --go: #34d399; --good: #a3e635; --marginal: #fbbf24;
    --risky: #fb923c; --stay: #f87171; --nodata: #9ca3af;
    --accent: #7dd3fc;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","PingFang HK","Noto Sans TC",sans-serif;
    background:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55) 50%, transparent 51%),
      radial-gradient(1px 1px at 68% 8%,  rgba(255,255,255,.4)  50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 30%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 35% 42%, rgba(255,255,255,.3)  50%, transparent 51%),
      radial-gradient(1px 1px at 52% 22%, rgba(255,255,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 25% 65%, rgba(255,255,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 70%, rgba(255,255,255,.4)  50%, transparent 51%),
      linear-gradient(180deg, #070b14 0%, var(--bg) 40%, #0d1330 100%);
    background-attachment: fixed;
    color: var(--text); min-height: 100vh;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    background: rgba(10,14,26,.78);
    border-bottom: 1px solid var(--card-border);
    padding: calc(10px + env(safe-area-inset-top)) 0 10px; margin-bottom: 14px;
  }
  .header-inner { display:flex; align-items:center; max-width:560px; margin:0 auto; padding:0 16px; }
  h1 { font-size:1.1rem; font-weight:700; flex:1; }
  h1 .sub { display:block; font-size:.66rem; font-weight:400; color:var(--text-dim); margin-top:1px; }
  .ver {
    font-size:.72rem; font-weight:700; color:var(--accent);
    background:rgba(125,211,252,.12); border:1px solid rgba(125,211,252,.3);
    border-radius:99px; padding:3px 10px; letter-spacing:.03em;
  }
  .refresh-btn {
    flex:1; text-align:right; background:none; border:none; color:var(--text);
    font-size:.85rem; cursor:pointer;
  }
  .refresh-btn span { display:inline-block; background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:8px 14px; }
  .refresh-btn.spinning .ico { animation: spin 1s linear infinite; display:inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .seg { display:flex; gap:6px; margin: 2px 0 12px; background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:4px; }
  .seg button { flex:1; border:none; background:transparent; color:var(--text-dim); padding:9px 0; border-radius:11px; font-size:.88rem; font-weight:600; cursor:pointer; }
  .seg button.on { background:rgba(125,211,252,.16); color:var(--accent); }
  .mode { display:flex; gap:6px; margin: 0 0 10px; background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:4px; }
  .mode button { flex:1; border:none; background:transparent; color:var(--text-dim); padding:9px 0; border-radius:11px; font-size:.88rem; font-weight:600; cursor:pointer; }
  .mode button.on { background:rgba(125,211,252,.16); color:var(--accent); }
  .spotgroup { font-size:.9rem; font-weight:700; color:var(--text); margin:16px 4px 8px; }
  .spot { background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:13px 14px; margin-bottom:10px; }
  .spot .st { font-size:.92rem; font-weight:700; color:var(--text); }
  .spot .meta { font-size:.72rem; color:var(--text-dim); margin-top:2px; }
  .spot .stars { color:var(--warn); letter-spacing:1px; }
  .spot .sun { font-size:.76rem; color:var(--warn); margin-top:6px; font-variant-numeric:tabular-nums; }
  .spot .acc { font-size:.76rem; color:var(--text); margin-top:6px; line-height:1.5; }
  .spot .nt { font-size:.74rem; color:var(--text-dim); margin-top:4px; line-height:1.5; }
  .spot .guide { margin-top:8px; padding:8px 9px; border-left:2px solid rgba(125,211,252,.55); background:rgba(125,211,252,.05); border-radius:0 9px 9px 0; font-size:.73rem; color:var(--text); line-height:1.58; }
  .spot .guide b { color:var(--accent); font-weight:700; }
  .spot .tags { margin-top:7px; display:flex; flex-wrap:wrap; gap:5px; }
  .samples { margin-top:9px; display:flex; gap:6px; overflow-x:auto; padding-bottom:3px; -webkit-overflow-scrolling:touch; }
  .samples img { height:88px; min-width:88px; max-width:150px; object-fit:cover; border-radius:8px; border:1px solid var(--card-border); cursor:pointer; flex-shrink:0; background:var(--card-border); }
  .sample_note { font-size:.7rem; color:var(--text-dim); margin-top:4px; font-style:italic; }
  #lightbox { position:fixed; inset:0; z-index:99; background:rgba(0,0,0,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px; cursor:zoom-out; }
  #lightbox[hidden] { display:none !important; }
  #lightbox img { max-width:100%; max-height:78vh; border-radius:10px; }
  #lightbox .lb-att { color:#cbd5e1; font-size:.72rem; margin-top:10px; text-align:center; line-height:1.5; }
  #lightbox .lb-att a { color:var(--accent); }
  .spot .tag { font-size:.62rem; padding:2px 8px; border-radius:999px; background:rgba(125,211,252,.12); color:var(--accent); border:1px solid rgba(125,211,252,.25); }
  .spot .tag.warn { background:rgba(251,113,133,.14); color:var(--stay); border-color:rgba(251,113,133,.3); }
  .spot .nav { display:inline-block; margin-top:8px; font-size:.74rem; color:var(--accent); text-decoration:none; border:1px solid rgba(125,211,252,.35); border-radius:999px; padding:5px 12px; }
  .day-event { display:flex; gap:6px; margin:0 0 10px; }
  .day-event button { flex:1; border:1px solid var(--card-border); background:var(--card); color:var(--text-dim); padding:9px 0; border-radius:12px; font-size:.84rem; font-weight:700; cursor:pointer; }
  .day-event button.on { border-color:rgba(251,191,36,.45); background:rgba(251,191,36,.13); color:#fcd34d; }
  .daycard { background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:13px 14px; margin-bottom:10px; }
  .daycard .head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .daycard h2 { font-size:.94rem; }
  .dayscore { font-size:1rem; font-weight:800; white-space:nowrap; }
  .daymeta { margin-top:6px; color:var(--text-dim); font-size:.74rem; line-height:1.55; }
  .daynotes { margin-top:7px; font-size:.75rem; line-height:1.55; }
  .stamp { font-size:.7rem; color:var(--text-dim); text-align:right; margin:0 2px 10px; }

  .hero { border-radius:20px; padding:18px; margin-bottom:14px; border:1px solid var(--card-border);
    background: linear-gradient(135deg, rgba(125,211,252,.09), rgba(167,139,250,.07)); }
  .hero .k { font-size:.72rem; color:var(--text-dim); letter-spacing:.12em; }
  .hero .v { font-size:1.24rem; font-weight:700; margin-top:5px; line-height:1.35; }
  .hero .why { font-size:.85rem; color:var(--text-dim); margin-top:6px; line-height:1.5; }
  details.hero-why { margin-top:9px; }
  details.hero-why summary { color:var(--accent); cursor:pointer; font-size:.78rem; list-style:none; }
  details.hero-why summary::-webkit-details-marker { display:none; }
  details.hero-why[open] summary { opacity:.75; }
  details.hero-why .why-body { margin-top:6px; font-size:.82rem; color:var(--text-dim); line-height:1.55; }
  .page-note { font-size:.64rem; color:var(--text-dim); text-align:center; margin:0 6px 10px; line-height:1.6; }
  .ai-note { margin-top:10px; padding:9px 11px; border-left:2px solid var(--accent); background:rgba(125,211,252,.06); border-radius:0 10px 10px 0; font-size:.78rem; line-height:1.55; }
  .ai-note b { color:var(--accent); }

  .card { background: var(--card); border:1px solid var(--card-border); border-radius:20px; padding:16px; margin-bottom:12px; animation: rise .35s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(10px);} to {opacity:1; transform:none;} }
  .card-top { display:flex; align-items:center; gap:13px; }
  .ring { position:relative; width:66px; height:66px; flex:none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .num b { font-size:1.25rem; line-height:1; }
  .ring .num span { font-size:.55rem; color:var(--text-dim); margin-top:2px; }
  .card-title { flex:1; min-width:0; }
  .card-title h2 { font-size:1.02rem; font-weight:700; }
  .card-title .mtn { font-size:.8rem; color:var(--text-dim); margin-top:2px; }
  .badge { font-size:.68rem; font-weight:700; padding:4px 10px; border-radius:99px; white-space:nowrap; }
  .b-GO { background:rgba(52,211,153,.16); color:var(--go); }
  .b-GOOD { background:rgba(163,230,53,.14); color:var(--good); }
  .b-MARGINAL { background:rgba(251,191,36,.14); color:var(--marginal); }
  .b-RISKY { background:rgba(251,146,60,.14); color:var(--risky); }
  .b-STAY_HOME { background:rgba(248,113,113,.14); color:var(--stay); }
  .b-NO_DATA { background:rgba(156,163,175,.14); color:var(--nodata); }

  .flags { margin-top:10px; display:flex; flex-direction:column; gap:5px; }
  .flag { font-size:.78rem; padding:7px 10px; border-radius:10px; line-height:1.45; }
  .flag.veto { background:rgba(248,113,113,.10); color:#fca5a5; }
  .flag.cap  { background:rgba(251,191,36,.08); color:#fcd34d; }

  /* ── Timeline ── */
  .tl { margin-top:12px; }
  .tl svg { width:100%; height:auto; display:block; touch-action:none; user-select:none; }
  .tl .readout {
    margin-top:6px; text-align:center; font-size:.8rem; font-weight:600; color:var(--accent);
    background:rgba(125,211,252,.07); border-radius:10px; padding:6px 8px;
  }
  .tl .hint { text-align:center; font-size:.64rem; color:var(--text-dim); margin-top:4px; }

  /* ── 三張指標小卡 ── */
  .mini3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
  .mini { background:rgba(255,255,255,.035); border:1px solid var(--card-border); border-radius:14px; padding:10px 8px; text-align:center; }
  .mini .mt { display:flex; align-items:center; justify-content:center; gap:5px; font-size:.78rem; font-weight:700; }
  .mini .ml { font-size:.62rem; font-weight:700; padding:1px 7px; border-radius:99px; }
  .l-好 { background:rgba(52,211,153,.14); color:var(--go); }
  .l-中 { background:rgba(251,191,36,.14); color:var(--marginal); }
  .l-差 { background:rgba(248,113,113,.14); color:var(--stay); }
  .l-無資料 { background:rgba(156,163,175,.12); color:var(--nodata); }
  .mini .graphic { margin:8px auto 6px; display:flex; align-items:center; justify-content:center; min-height:34px; }
  .mini .ms { font-size:1.05rem; font-weight:700; }
  .mini .md { font-size:.64rem; color:var(--text-dim); margin-top:4px; line-height:1.55; }
  .mini .md a { color:var(--accent); text-decoration:none; }
  .wind-detail { margin-top:8px; font-size:.72rem; color:var(--text-dim); }
  .wind-detail summary { color:var(--accent); cursor:pointer; font-size:.72rem; }
  .wind-detail table { width:100%; border-collapse:collapse; margin-top:6px; text-align:center; }
  .wind-detail th, .wind-detail td { padding:2px 4px; border-bottom:1px solid var(--card-border); font-weight:400; }
  .wind-detail .calm { margin-top:6px; line-height:1.55; }
  .cloudbar { width:100%; height:10px; border-radius:99px; overflow:hidden; display:flex; background:rgba(255,255,255,.06); }
  .cloudbar span { display:block; height:100%; }

  /* ── bonus 行 ── */
  .bonus { margin-top:11px; display:flex; flex-direction:column; gap:7px; }
  .brow { display:flex; gap:9px; font-size:.82rem; align-items:baseline; }
  .brow .ico { width:18px; text-align:center; flex:none; }
  .brow .txt { flex:1; line-height:1.5; }
  .brow .dim { color:var(--text-dim); }

  .gearwarn { margin-top:10px; background:rgba(251,191,36,.07); border:1px solid rgba(251,191,36,.2);
    border-radius:12px; padding:9px 11px; font-size:.78rem; line-height:1.65; }

  .expand-btn { width:100%; margin-top:12px; background:none; border:none; color:var(--accent);
    font-size:.8rem; padding:7px; cursor:pointer; border-top:1px solid var(--card-border); }
  .detail { display:none; margin-top:10px; }
  .detail.open { display:block; }
  .detail h3 { font-size:.75rem; color:var(--text-dim); margin:10px 0 6px; letter-spacing:.08em; }
  .htable { overflow-x:auto; border-radius:12px; border:1px solid var(--card-border); }
  table { width:100%; border-collapse:collapse; font-size:.74rem; white-space:nowrap; }
  th, td { padding:7px 8px; text-align:right; }
  th { color:var(--text-dim); font-weight:600; background:rgba(255,255,255,.03); }
  td { border-top:1px solid rgba(255,255,255,.05); }
  td:first-child, th:first-child { text-align:left; }
  .gear { font-size:.8rem; line-height:1.7; }
  .src { font-size:.68rem; color:var(--text-dim); margin-top:10px; line-height:1.6; }
  .day-window { margin:10px 12px 2px; padding:10px 12px; border-radius:10px; background:rgba(251,191,36,.09); border:1px solid rgba(251,191,36,.27); display:grid; grid-template-columns:1fr auto; gap:2px 8px; align-items:baseline; color:#fcd34d; font-size:.78rem; }
  .day-window b { font-size:1rem; letter-spacing:.02em; }
  .day-window small { grid-column:1/-1; color:var(--text-dim); font-size:.68rem; }
  .day-disclaimer { margin:0 14px 14px; color:var(--text-dim); font-size:.64rem; line-height:1.45; }

  .sorry { border:1px solid rgba(248,113,113,.25); background:rgba(248,113,113,.06); border-radius:20px; padding:18px; margin-bottom:12px; }
  .sorry h2 { font-size:.95rem; color:#fca5a5; }
  .sorry p { font-size:.82rem; color:var(--text-dim); margin-top:6px; line-height:1.55; }

  .skel { border-radius:20px; height:230px; margin-bottom:12px;
    background:linear-gradient(90deg, var(--card) 25%, rgba(255,255,255,.09) 50%, var(--card) 75%);
    background-size:200% 100%; animation: shimmer 1.3s infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .foot { text-align:center; font-size:.68rem; color:var(--text-dim); margin-top:18px; line-height:1.8; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>🌌 銀河儀表板<span class="sub">Rockies Milky Way Scout</span></h1>
    <span class="ver" id="ver">v—</span>
    <button class="refresh-btn" id="refreshBtn"><span><span class="ico">↻</span> <span id="refreshLabel">更新</span></span></button>
  </div>
</header>

<div class="wrap">
  <div class="mode" id="mode">
    <button data-m="mw" class="active">🌌 銀河</button>
    <button data-m="sunrise">🌅 日出</button>
    <button data-m="sunset">🌇 日落</button>
    <button data-m="spots">🏔️ 拍攝點</button>
  </div>
  <div class="seg" id="seg">
    <button data-offset="0" class="on">今晚</button>
    <button data-offset="1">明晚</button>
    <button data-offset="2">後晚</button>
  </div>
  <div class="stamp" id="stamp"></div>
  <div id="mwview">
    <div id="hero"></div>
    <div id="cards"></div>
  </div>
  <div id="dayview" hidden></div>
  <div id="spotview" hidden></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const GRADE_COLOR = { GO:'#34d399', GOOD:'#a3e635', MARGINAL:'#fbbf24', RISKY:'#fb923c', STAY_HOME:'#f87171', NO_DATA:'#9ca3af' };
const GRADE_ZH = { GO:'立即出發', GOOD:'值得前往', MARGINAL:'可嘗試但有風險', RISKY:'不太建議', STAY_HOME:'留在家中', NO_DATA:'無法評估' };
let currentOffset = 0, lastData = null, expanded = new Set(), scrubState = {};

function dateFor(offset){
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Edmonton',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts().filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
  const d=new Date(Date.UTC(+parts.year,+parts.month-1,+parts.day+offset));
  return d.toISOString().slice(0,10);
}
function setSegmentLabels(mode){
  const labels=['sunrise','sunset'].includes(mode)?['今天','明天','後天']:['今晚','明晚','後晚'];
  document.querySelectorAll('#seg button').forEach((b,i)=>b.textContent=labels[i]);
}
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* 後端字串 → 書面中文 */
function zh(s){
  return String(s??'')
    .replace('成晚月光晒住','整夜受月光照射')
    .replace('基本冚唪唥','幾乎滿天雲')
    .replace('月亮唔阻','月亮不影響')
    .replace('冇完整天文黑夜','無完整天文黑夜')
    .replace('唔夠','未達')
    .replace('唔准','不准')
    .replace('放喺袋','放在袋裡')
    .replace('隨時上','隨時取用')
    .replace('入暖車前装密實袋','進入溫暖車內前裝入密實袋')
    .replace('必帶','必備')
    .replace('唔係','不是')
    .replace('唔使','不用')
    .replace('冇','沒有')
    .replace('唔','不');
}
function labelOf(s){ return s>=78?'好':(s>=48?'中':'差'); }
/* 否決／封頂 flag：Tier 1 只留短句，門檻說明收折疊 */
function shortFlag(s){
  let t=zh(s);
  t=t.replace(/（[^）]*）/g,'');
  t=t.replace(/窗口內無月時段 = (\d+) 分鐘/,'無月 $1 分鐘');
  t=t.replace(/窗口內無月時段只有 (\d+) 分鐘/,'無月僅 $1 分鐘');
  t=t.replace(/：/,' · ').replace(/，/g,' · ');
  return t;
}
function colorOfScore(s){ for(const [t,c] of [[85,'#34d399'],[70,'#a3e635'],[55,'#fbbf24'],[40,'#fb923c']]) if(s>=t) return c; return '#f87171'; }

/* 時間 → 分鐘（18:00 = 0，跨午夜 +1440） */
function t2m(hhmm){ const [h,m]=hhmm.split(':').map(Number); let t=h*60+m; if(h<18) t+=1440; return t-1080; }
function m2t(min){ let t=(min+1080)%1440; return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }

function ringSVG(score, color){
  const r=27, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(100,score||0))/100);
  return `<svg width="66" height="66" viewBox="0 0 66 66">
    <circle cx="33" cy="33" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/>
    <circle cx="33" cy="33" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

/* ── Timeline（可拖曳）── */
const TL = { W:340, H:118, L:10, R:10, TOP:12, BOT:30 };
function tlX(min){ return TL.L + (min/960)*(TL.W-TL.L-TL.R); }
function tlY(alt){ const a=Math.max(-25,Math.min(15,alt)); return TL.TOP + (1-(a+25)/40)*(TL.H-TL.BOT-TL.TOP); }

function timelineSVG(loc){
  const id = loc.location_id;
  const dw = loc.darkness_window;
  const curve = loc.sun_curve || [];
  const pts = curve.map(p=>`${tlX(t2m(p[0])).toFixed(1)},${tlY(p[1]).toFixed(1)}`).join(' ');
  const w0 = tlX(t2m(dw.start)), w1 = tlX(t2m(dw.end));
  const moonRects = (loc.moon.up_periods_night||[]).map(p=>{
    const x0=tlX(t2m(p[0])), x1=tlX(t2m(p[1]));
    return `<rect x="${x0}" y="${TL.TOP}" width="${Math.max(1,x1-x0)}" height="${TL.H-TL.BOT-TL.TOP}" fill="rgba(251,191,36,.09)"/>`;
  }).join('');
  const strip = (loc.hourly||[]).map(h=>{
    const x=tlX(t2m(h.time));
    return `<rect x="${x}" y="${TL.H-22}" width="${(TL.W-TL.L-TL.R)/960*60-1}" height="8" rx="2" fill="${colorOfScore(h.astro_score)}" opacity=".85"/>`;
  }).join('');
  const ticks = [0,180,360,540,720,900].map(m=>
    `<text x="${tlX(m)}" y="${TL.H-4}" font-size="8" fill="#8b93a7" text-anchor="middle">${m2t(m).replace(':00','')}</text>` +
    `<line x1="${tlX(m)}" y1="${TL.H-26}" x2="${tlX(m)}" y2="${TL.H-14}" stroke="rgba(255,255,255,.12)"/>`
  ).join('');
  const initMin = t2m(dw.min_sun_altitude_time);
  scrubState[id] = initMin;
  return `<div class="tl" data-loc="${id}">
    <svg viewBox="0 0 ${TL.W} ${TL.H}" id="tl-${id}">
      ${moonRects}
      <rect x="${w0}" y="${TL.TOP}" width="${Math.max(1,w1-w0)}" height="${TL.H-TL.BOT-TL.TOP}" fill="rgba(125,211,252,.08)" stroke="rgba(125,211,252,.35)" stroke-dasharray="3 2" rx="3"/>
      <line x1="${TL.L}" y1="${tlY(0)}" x2="${TL.W-TL.R}" y2="${tlY(0)}" stroke="rgba(255,255,255,.25)" stroke-dasharray="4 3"/>
      <line x1="${TL.L}" y1="${tlY(-18)}" x2="${TL.W-TL.R}" y2="${tlY(-18)}" stroke="rgba(125,211,252,.4)" stroke-dasharray="2 3"/>
      <text x="${TL.W-TL.R}" y="${tlY(-18)-3}" font-size="7" fill="rgba(125,211,252,.7)" text-anchor="end">-18°</text>
      <text x="${TL.L+2}" y="${tlY(0)-3}" font-size="7" fill="rgba(255,255,255,.4)">地平線</text>
      <polyline points="${pts}" fill="none" stroke="#7dd3fc" stroke-width="1.6"/>
      ${strip}${ticks}
      <g class="scrub" style="pointer-events:none">
        <line class="sline" x1="${tlX(initMin)}" y1="${TL.TOP-2}" x2="${tlX(initMin)}" y2="${TL.H-26}" stroke="#fff" stroke-width="1.4"/>
        <circle class="sdot" cx="${tlX(initMin)}" cy="${TL.TOP-2}" r="6" fill="#fff" stroke="#0a0e1a" stroke-width="2"/>
      </g>
    </svg>
    <div class="readout" id="ro-${id}"></div>
  </div>`;
}

function sunAltAt(loc, min){
  const c = loc.sun_curve||[]; if(!c.length) return null;
  let best=c[0], bd=1e9;
  for(const p of c){ const d=Math.abs(t2m(p[0])-min); if(d<bd){bd=d;best=p;} }
  return best[1];
}
function moonUpAt(loc, min){
  return (loc.moon.up_periods_night||[]).some(p=>t2m(p[0])<=min && min<=t2m(p[1]));
}
function updateScrub(loc, min){
  const id=loc.location_id;
  min=Math.max(0,Math.min(960,Math.round(min/10)*10));
  scrubState[id]=min;
  const svg=document.getElementById('tl-'+id); if(!svg) return;
  const x=tlX(min);
  svg.querySelector('.sline').setAttribute('x1',x); svg.querySelector('.sline').setAttribute('x2',x);
  svg.querySelector('.sdot').setAttribute('cx',x);
  const alt=sunAltAt(loc,min), up=moonUpAt(loc,min);
  document.getElementById('ro-'+id).textContent =
    `${m2t(min)} · 太陽 ${alt!=null?alt+'°':'—'} · ${up?'🌕 月亮在地平線上':'🌑 月亮在地平線下'}`;
}
function attachScrub(loc){
  const svg=document.getElementById('tl-'+loc.location_id); if(!svg) return;
  let dragging=false;
  const go=e=>{
    const r=svg.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width*TL.W;
    updateScrub(loc, Math.round((px-TL.L)/(TL.W-TL.L-TL.R)*960));
  };
  svg.addEventListener('pointerdown', e=>{dragging=true; svg.setPointerCapture(e.pointerId); go(e);});
  svg.addEventListener('pointermove', e=>{ if(dragging) go(e); });
  svg.addEventListener('pointerup', ()=>dragging=false);
  svg.addEventListener('pointercancel', ()=>dragging=false);
  updateScrub(loc, scrubState[loc.location_id] ?? t2m(loc.darkness_window.min_sun_altitude_time));
}

/* ── 指標小卡資料 ── */
function windowHours(loc){
  const bw=loc.best_window, hrs=loc.hourly||[];
  let inWin = bw ? hrs.filter(h=>h.time>=bw.start && h.time<bw.end) : hrs;
  return inWin.length?inWin:hrs;
}
const avg=(arr,k)=>arr.length?arr.reduce((a,h)=>a+(h[k]??0),0)/arr.length:0;

function cloudMini(loc){
  const hrs=windowHours(loc);
  const low=avg(hrs,'cloud_low_pct'), mid=avg(hrs,'cloud_mid_pct'), high=avg(hrs,'cloud_high_pct');
  const s=Math.round(avg(hrs,'cloud_score')), l=labelOf(s);
  const sum=low+mid+high;
  const bar = sum<1 ? `<div style="font-size:.72rem;color:var(--go)">☀️ 幾乎無雲</div>` :
    `<div class="cloudbar"><span style="width:${low/sum*100}%;background:#f87171"></span><span style="width:${mid/sum*100}%;background:#fbbf24"></span><span style="width:${high/sum*100}%;background:#7dd3fc"></span></div>`;
  return `<div class="mini"><div class="mt">雲 <span class="ml l-${l}">${l}</span></div>
    <div class="graphic" style="width:100%">${bar}</div>
    <div class="ms">${s}</div>
    <div class="md">低雲 ${Math.round(low)}%<br>中雲 ${Math.round(mid)}% · 高雲 ${Math.round(high)}%</div></div>`;
}

function moonSVG(illum, uid){
  const w=13*illum/100;
  return `<svg width="32" height="32" viewBox="0 0 30 30">
    <circle cx="15" cy="15" r="13" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.25)"/>
    <clipPath id="mc${uid}"><circle cx="15" cy="15" r="12.4"/></clipPath>
    <ellipse cx="15" cy="15" rx="${w.toFixed(1)}" ry="12.4" fill="#f3e9c8" clip-path="url(#mc${uid})"/></svg>`;
}
function moonMini(loc){
  const hrs=windowHours(loc), m=loc.moon;
  const s=Math.round(avg(hrs,'moon_score')), l=labelOf(s);
  const detail = m.overlap_minutes_in_window===0
    ? '月亮在地平線下<br>不影響拍攝'
    : `重疊 ${m.overlap_minutes_in_window} 分鐘` + (m.moon_free_periods&&m.moon_free_periods.length?`<br>無月 ${m.moon_free_periods.map(p=>p[0]+'–'+p[1]).join('、')}`:'<br>整個窗口有月光');
  return `<div class="mini"><div class="mt">月 <span class="ml l-${l}">${l}</span></div>
    <div class="graphic">${moonSVG(m.illumination_pct, loc.location_id)}</div>
    <div class="ms">${s}</div>
    <div class="md">照明 ${Math.round(m.illumination_pct)}%<br>${detail}</div></div>`;
}

function aqiSVG(aqi){
  const color = aqi==null?'#9ca3af':aqi<=50?'#34d399':aqi<=100?'#fbbf24':aqi<=150?'#fb923c':'#f87171';
  const r=13, c=2*Math.PI*r, frac=Math.min(aqi||0,200)/200;
  return `<svg width="32" height="32" viewBox="0 0 32 32" style="transform:rotate(-90deg)">
    <circle cx="16" cy="16" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/>
    <circle cx="16" cy="16" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-frac)}"/></svg>`;
}
function smokeMini(loc){
  const hrs=windowHours(loc);
  const s=Math.round(avg(hrs,'smoke_score'));
  const noData = hrs.some(h=>h.smoke_label==='無資料') || hrs.every(h=>h.pm2_5==null);
  const l = noData?'無資料':labelOf(s);
  const pm = hrs.length?avg(hrs,'pm2_5'):null;
  const aqi = hrs.length?avg(hrs,'us_aqi'):null;
  const dir = hrs.find(h=>h.wind_dir)?.wind_dir;
  let infer;
  if (noData) infer='無煙塵數據';
  else if (pm<=10) infer='空氣大致乾淨';
  else infer=`盛行${dir||'—'}風——煙或來自上風方向山火（推測）`;
  return `<div class="mini"><div class="mt">煙 <span class="ml l-${l}">${l}</span></div>
    <div class="graphic">${aqiSVG(aqi)}</div>
    <div class="ms">${noData?'—':s}</div>
    <div class="md">${noData?'稍後再更新':`PM2.5 ${pm.toFixed(0)} · AQI ${Math.round(aqi)}<br>${infer}`}</div></div>`;
}

function windRow(loc){
  const hrs=windowHours(loc); if(!hrs.length) return '';
  const w=Math.round(avg(hrs,'wind_kmh')), g=Math.round(Math.max(...hrs.map(h=>h.gust_kmh||0)));
  const dir=hrs.find(h=>h.wind_dir)?.wind_dir||'';
  const refl = w<=6?'鏡面倒影':w<=10?'接近鏡面':w<=15?'微波':w<=20?'明顯波紋':'倒影無望';
  return `<div class="brow"><span class="ico">💨</span><span class="txt">${dir}風 ${w} km/h · 陣風 ${g} <span class="dim">· 倒影：${refl}</span></span></div>`;
}

function gcRow(loc){
  const gc=loc.galactic_center;
  const main = gc.max_altitude_in_window!=null&&gc.max_altitude_in_window>0
    ? `銀心最高 ${gc.max_altitude_in_window}° @ ${gc.max_altitude_time}（${gc.direction}）${gc.above_10deg_period?'':' · 太貼地平線'}`
    : '窗口內銀心在地平線下';
  return `<div class="brow"><span class="ico">🌌</span><span class="txt">${main}</span></div>`;
}

function gearWarn(loc){
  const warns=(loc.gear_advice||[]).filter(g=>/[🔴🟡❄️🔋]/u.test(g));
  if(!warns.length) return '';
  return `<div class="gearwarn">${warns.map(g=>`<div>${esc(zh(g))}</div>`).join('')}</div>`;

const VERDICT_COLOR={'值得去':'#4ade80','可以去':'#a3e635','邊緣':'#fbbf24','留在家':'#9ca3af'};

function sorryHTML(loc){

function spotCard(s){
  const stars = '★'.repeat(s.rating||1) + '☆'.repeat(3-(s.rating||1));

  const timeStr = s.cat==='night' ? '' :
    (isSR
      ? (s.sunrise?`🌅 日出 ${s.sunrise} · 建議 ${shift(s.sunrise,-30)}–${shift(s.sunrise,60)} 在場`:'')
      : (s.sunset?`🌇 日落 ${s.sunset} · 建議 ${shift(s.sunset,-60)}–${shift(s.sunset,30)} 在場`:''));
  const tags = (s.tags||[]).map(t=>{
    const warn = /待確認|無 trail|shuttle|封路|估計座標|人多/.test(t);

  const thumbs = (s.samples||[]).map((sm,i)=>`<img loading="lazy" src="${escAttr(sm.thumb)}" alt="構圖參考 ${i+1}" onclick="openLB('${escAttr(s.id)}',${i})">`).join('');
  const sblock = thumbs ? `<div class="samples">${thumbs}</div>${s.sample_note?`<div class="sample_note">${esc(zh(s.sample_note))}</div>`:''}` : '';

    <div class="acc">📍 ${esc(zh(s.access||''))}</div>
    ${s.purpose?`<div class="guide"><b>拍攝建議</b><br>${esc(zh(s.purpose))}${s.season?`<br><b>季節窗口</b> ${esc(zh(s.season))}`:''}${s.caveat?`<br><b>注意</b> ${esc(zh(s.caveat))}`:''}</div>`:''}
    ${s.note?`<div class="nt">${esc(zh(s.note))}</div>`:''}

function shift(hhmm, mins){
  if(!hhmm) return '';
  const [h,m]=hhmm.split(':').map(Number);
  let t=h*60+m+mins; t=((t%1440)+1440)%1440;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}

/* sample image lightbox */

function dayGrade(score){ return score>=80?'GO':score>=65?'GOOD':score>=45?'MARGINAL':'RISKY'; }

function dayWindMini(e){ const w=e.weather,c=e.components,wd=e.wind_detail;

    <div class="ms">${c.wind}</div><div class="md">平均 ${wd.range[0]}–${wd.range[1]} km/h<br>陣風 ${gustTxt} · ${descOf(wd.range[1])}</div></div>`;
}
function dayWindDetail(e){ const wd=e.wind_detail; if(!wd||wd.ecmwf_missing||!wd.curve||!wd.curve.length) return '';
  const rows=wd.curve.map(r=>`<tr><td>${r.t}</td><td>${r.best??'—'}</td><td>${r.ecmwf??'—'}</td></tr>`).join('');
  const calm=v=>v?`${v} 起鏡面`:'窗口內未見鏡面';
  return `<details class="wind-detail"><summary>逐小時雙模型風速（幾何${e.event==='sunrise'?'日出':'日落'}前 1h → 後 2.5h）</summary>
    <table><thead><tr><th>時間</th><th>預設</th><th>ECMWF</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="calm">鏡面（≤6 km/h）：預設 ${calm(wd.calm_best)} · ECMWF ${calm(wd.calm_ecmwf)}<br>單位 km/h · Open-Meteo best_match ＋ ecmwf_ifs025</div></details>`;
}
function daySmokeMini(e){ const w=e.weather,c=e.components;
  const detail=w.pm2_5!=null?`PM2.5 ${w.pm2_5} µg/m³<br>US AQI ${w.us_aqi??'—'}`:'煙塵資料暫缺<br>以不確定值計算';
  return `<div class="mini"><div class="mt">煙 <span class="ml l-${labelOf(c.smoke)}">${labelOf(c.smoke)}</span></div><div class="graphic" style="font-size:1.45rem">🌫️</div>
    <div class="ms">${c.smoke}</div><div class="md">${detail}</div></div>`;
}
function daylightCard(p,e,isBest){
  if(p.error || e.error) return `<div class="sorry"><h2>🙇 ${esc(p.name)} 暫時無法評估</h2><p>${esc(p.message||e.message||'未知原因')}</p></div>`;
  const l=e.light,g=dayGrade(e.score),color=GRADE_COLOR[g];
  const eventName=e.event==='sunrise'?'日出':'日落';
  const model=l.model?`DEM ${l.model.time} · 太陽 ${l.model.sun_altitude_deg}°／${l.model.sun_azimuth_deg}° · 山脊 ${l.model.terrain_horizon_deg}°`:'';
  const dateText=lastData?.daylight?.date||'日期資料暫缺';
  return `<div class="card day-card">
    <div class="card-top"><div class="ring">${ringSVG(e.score,color)}<div class="num"><b style="color:${color}">${e.score}</b><span>分</span></div></div>
      <div class="card-title"><h2>${isBest?'⭐ ':''}${esc(zh(p.name))}</h2><div class="mtn">${dateText} · ${eventName} · 雲／風／煙 · 火燒雲機率</div></div><span class="badge b-${g}">${esc(e.label)}</span></div>
    <div class="day-window"><span>📷 拍攝窗口</span><b>${l.window.start} → ${l.window.end}</b><small>${l.label} ${l.time} · 幾何${eventName} ${l.geometric_time}</small></div>
    <div class="mini3">${dayCloudMini(e)}${dayWindMini(e)}${daySmokeMini(e)}</div>
    <div class="bonus"><div class="brow"><span class="ico">☀️</span><span class="txt">${l.confidence==='field'?'West 實測／判讀':'地形模型'}：${esc(l.basis)}</span></div>
    <div class="brow"><span class="ico">🌤️</span><span class="txt">${e.notes.map(esc).join(' · ')}<br><span class="dim">能見度 ${e.weather.visibility_km} km · 降水 ${e.weather.precip_probability_pct}%</span></span></div></div>
    ${model?`<div class="src" style="margin-top:8px">${esc(model)}</div>`:''}${dayWindDetail(e)}</div>`;
}

function renderDaylight(data){
  const d=data.daylight;
  const root=document.getElementById('dayview');
  if(!d || d.error){ root.innerHTML=`<div class="sorry"><h2>🙇 日出／日落暫時無法評估</h2><p>${esc(d?.message||'沒有日間資料')}</p></div>`; return; }
  const cards=d.points.filter(p=>p.events && p.events[daylightEvent]).map(p=>({p,e:p.events[daylightEvent]})).sort((a,b)=>(b.e.score||0)-(a.e.score||0));
  const valid=cards.filter(x=>!x.e.error), best=valid[0];
  const dateWord=['今天','明天','後天'][currentOffset]||'當日';
  root.innerHTML=`<div class="hero" style="padding:13px 14px"><div class="k">${dateWord}${daylightEvent==='sunrise'?'日出':'日落'}結論</div><div class="v" style="color:${best?daylightColor(best.e.score):'#9ca3af'}">${best?`⭐ ${esc(best.p.name)} — ${best.e.score} 分`:'🙇 暫時無法評估'}</div><div class="why">${esc(d.method)}。拍攝窗口與評分以幾何日出／日落為錨點；地形首束／末束直射光為山體受光資訊。</div></div>
    <div class="page-note">${esc(d.terrain_disclaimer||'')}</div>
    ${cards.map((x,i)=>daylightCard(x.p,x.e,i===0)).join('') || '<div class="nt" style="padding:20px">此日期沒有對應的拍攝點資料</div>'}`;
}

function renderSpots(data){
  const pts = data.spots||[];
  const intro = `<div class="hero" style="padding:13px 14px"><div class="k">拍攝點使用方式</div><div class="why">「季節窗口」是長期選景建議，不是天氣保證。日出／日落時間只代表幾何地平線；山體何時收到直射光，必須以該日期與現場地形實測為準。</div></div>`;
  document.getElementById('spotview').innerHTML = intro + SPOT_GROUPS.map(([cat,title])=>{
    const items = pts.filter(p=>p.cat===cat);
    if(!items.length) return '';
    return `<div class="spotgroup">${title}</div>` + items.map(spotCard).join('');
  }).join('') || '<div class="nt" style="padding:20px">此日期沒有拍攝點資料</div>';
}

const FOOT_MW='雲45% · 月25% · 煙20% · 風10%（倒影）<br>Open-Meteo · CAMS · skyfield — 只使用機位本身座標<br><a href="https://firesmoke.ca" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">煙霧預報圖 ↗</a>';
function render(data){
  lastData=data;
  document.getElementById('ver').textContent='v'+(data.version||'—');
  document.getElementById('hero').innerHTML=heroHTML(data);
  const ok=data.locations.filter(l=>!l.error).sort((a,b)=>b.night.score-a.night.score);
  const bad=data.locations.filter(l=>l.error);
  const analysisBestId=data.best_location_id;
  const anyTimeline=ok.some(l=>!l.night.vetoes.length);
  const seasonNote=ok.map(l=>l.vertical_mw).find(Boolean);
  document.getElementById('cards').innerHTML =
    (anyTimeline?'<div class="page-note">拖曳時間軸檢視任意時間的太陽角度 · 色帶 = 天文黑夜窗口 · 黃色 = 月亮在地平線上 · 底部色塊 = 每小時評分</div>':'') +
    (seasonNote?`<div class="page-note">🌌 季節：${esc(seasonNote)}</div>`:'') +
    ok.map(l=>cardHTML(l,l.location_id===analysisBestId)).join('') + bad.map(sorryHTML).join('');
  ok.forEach(attachScrub);
  const age=data.cache_age_seconds?`（快取 ${data.cache_age_seconds}s）`:'';
  const modeTag=data._mode==='static'?'☁️ 固定公式更新':'⚡ 即時計算';
  document.getElementById('stamp').innerHTML=`${modeTag} · <span style="font-size:.62rem">數據 ${esc(data.generated_at)}${age}</span>`;
  document.getElementById('foot').innerHTML=FOOT_MW;
  renderSpots(currentOffset===0?data:(spotsReport||data));
  renderDaylight(data);
}

function loading(){
  document.getElementById('hero').innerHTML='';
  document.getElementById('cards').innerHTML='<div class="skel"></div>'.repeat(6);
  document.getElementById('stamp').textContent='正在即時分析六個機位（約 10–30 秒）…';
}

async function load(){
  const btn=document.getElementById('refreshBtn');
  const lbl=document.getElementById('refreshLabel');
  btn.classList.add('spinning'); btn.disabled=true; if(lbl) lbl.textContent='更新中…';
  if(!lastData) loading();  /* 保留舊內容直至新數據到達 */
  try{
    let data=null;
    try{
      const r=await fetch('/api/report?date='+dateFor(currentOffset));
      if(!r.ok) throw new Error('HTTP '+r.status);
      data=await r.json(); data._mode='live';
    }catch(e1){
      const r2=await fetch('report-'+currentOffset+'.json?_='+Date.now());
      if(!r2.ok) throw new Error('靜態數據也沒有（HTTP '+r2.status+'）');
      data=await r2.json(); data._mode='static';
    }
    render(data);
  }catch(e){
    if(lastData){
      document.getElementById('stamp').textContent='更新失敗：'+e.message+'（仍顯示上次數據）';
    }else{
      document.getElementById('hero').innerHTML=`<div class="sorry"><h2>🙇 對不起，取不到數據</h2><p>${esc(e.message)}</p><p style="margin-top:8px;font-size:.75rem">我不會提供假數據。請檢查網絡，或稍後再按更新。</p></div>`;
      document.getElementById('cards').innerHTML='';
    }
  }finally{ btn.classList.remove('spinning'); btn.disabled=false; if(lbl) lbl.textContent='更新'; }
}

/* 拍攝點 tab：長期選景資料唔綁 report-N，永遠用 report-0（今晚）嘅日出日落時間 */
let spotsReport=null;
async function loadSpots(){
  if(currentOffset===0 && lastData){ spotsReport=null; renderSpots(lastData); return; }
  if(spotsReport){ renderSpots(spotsReport); return; }
  try{
    let d=null;
    try{
      const r=await fetch('/api/report?date='+dateFor(0));
      if(!r.ok) throw new Error('HTTP '+r.status);
      d=await r.json();
    }catch(e1){
      const r2=await fetch('report-0.json?_='+Date.now());
      if(!r2.ok) throw new Error('HTTP '+r2.status);
      d=await r2.json();
    }
    spotsReport=d; renderSpots(d);
  }catch(e){ if(lastData) renderSpots(lastData); }
}

function toggle(id){
  expanded.has(id)?expanded.delete(id):expanded.add(id);
  if(lastData) render(lastData);
}

document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); currentOffset=+b.dataset.offset; load();
});
document.getElementById('mode').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#mode button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const mode=b.dataset.m;
  document.getElementById('mwview').hidden = mode!=='mw';
  document.getElementById('spotview').hidden = mode!=='spots';
  document.getElementById('dayview').hidden = !['sunrise','sunset'].includes(mode);
  document.getElementById('seg').style.display = mode==='spots' ? 'none' : '';
  setSegmentLabels(mode);
  if(mode==='spots'){ loadSpots(); }
  if(mode==='sunrise' || mode==='sunset'){
    daylightEvent=mode;
    document.getElementById('foot').innerHTML='雲50%（色彩雲層×地平線開口） · 煙30%（PM2.5） · 風20%（倒影 · 雙模型對比取保守）<br>Open-Meteo（best_match ＋ ECMWF IFS） · CAMS 空氣質素 · Skyfield · AWS Terrain Tiles SRTM DEM · 現場實測優先';
    if(lastData) renderDaylight(lastData);
  } else {
    document.getElementById('foot').innerHTML=FOOT_MW;
  }
});
document.getElementById('refreshBtn').addEventListener('click',load);
load();
setInterval(load,600000);
</script>
  <div id="lightbox" hidden onclick="closeLB()"></div>
</body>
