<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>🌌 銀河儀表板</title>
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #111830;
    --card: rgba(255,255,255,0.045);
    --card-border: rgba(255,255,255,0.09);
    --text: #e8ecf4;
    --text-dim: #8b93a7;
    --go: #34d399;
    --good: #a3e635;
    --marginal: #fbbf24;
    --risky: #fb923c;
    --stay: #f87171;
    --nodata: #9ca3af;
    --accent: #7dd3fc;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { font-size:16px; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","PingFang HK","Noto Sans TC",sans-serif;
    background:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55) 50%, transparent 51%),
      radial-gradient(1px 1px at 68% 8%,  rgba(255,255,255,.4)  50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 30%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 35% 42%, rgba(255,255,255,.3)  50%, transparent 51%),
      radial-gradient(1px 1px at 52% 22%, rgba(255,255,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 25% 65%, rgba(255,255,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 70%, rgba(255,255,255,.4)  50%, transparent 51%),
      linear-gradient(180deg, #070b14 0%, var(--bg) 40%, #0d1330 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    background: rgba(10,14,26,.78);
    border-bottom: 1px solid var(--card-border);
    padding: calc(10px + env(safe-area-inset-top)) 0 10px;
    margin-bottom: 14px;
  }
  .header-inner { display:flex; align-items:center; justify-content:space-between; max-width:560px; margin:0 auto; padding:0 16px; }
  h1 { font-size:1.15rem; font-weight:700; letter-spacing:.02em; }
  h1 .sub { display:block; font-size:.68rem; font-weight:400; color:var(--text-dim); margin-top:1px; }
  .refresh-btn {
    background: var(--card); border:1px solid var(--card-border); color:var(--text);
    border-radius: 12px; padding: 8px 14px; font-size:.85rem; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition: transform .1s;
  }
  .refresh-btn:active { transform: scale(.95); }
  .refresh-btn.spinning .ico { animation: spin 1s linear infinite; display:inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Segmented date ── */
  .seg { display:flex; gap:6px; margin: 2px 0 14px; background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:4px; }
  .seg button {
    flex:1; border:none; background:transparent; color:var(--text-dim);
    padding:9px 0; border-radius:11px; font-size:.88rem; font-weight:600; cursor:pointer;
  }
  .seg button.on { background:rgba(125,211,252,.16); color:var(--accent); }

  /* ── Hero verdict ── */
  .hero {
    border-radius:20px; padding:18px; margin-bottom:14px;
    border:1px solid var(--card-border);
    background: linear-gradient(135deg, rgba(125,211,252,.09), rgba(167,139,250,.07));
  }
  .hero .k { font-size:.72rem; color:var(--text-dim); letter-spacing:.12em; text-transform:uppercase; }
  .hero .v { font-size:1.28rem; font-weight:700; margin-top:5px; line-height:1.35; }
  .hero .why { font-size:.85rem; color:var(--text-dim); margin-top:6px; line-height:1.5; }

  /* ── Location card ── */
  .card {
    background: var(--card); border:1px solid var(--card-border);
    border-radius:20px; padding:16px; margin-bottom:12px;
    animation: rise .35s ease both;
  }
  @keyframes rise { from { opacity:0; transform:translateY(10px);} to {opacity:1; transform:none;} }
  .card-top { display:flex; align-items:center; gap:14px; }
  .ring { position:relative; width:74px; height:74px; flex:none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .num b { font-size:1.35rem; line-height:1; }
  .ring .num span { font-size:.58rem; color:var(--text-dim); margin-top:2px; }
  .card-title { flex:1; min-width:0; }
  .card-title h2 { font-size:1.02rem; font-weight:700; }
  .card-title .mtn { font-size:.8rem; color:var(--text-dim); margin-top:2px; }
  .badge {
    font-size:.68rem; font-weight:700; padding:4px 10px; border-radius:99px;
    letter-spacing:.04em; white-space:nowrap;
  }
  .b-GO        { background:rgba(52,211,153,.16); color:var(--go); }
  .b-GOOD      { background:rgba(163,230,53,.14); color:var(--good); }
  .b-MARGINAL  { background:rgba(251,191,36,.14); color:var(--marginal); }
  .b-RISKY     { background:rgba(251,146,60,.14); color:var(--risky); }
  .b-STAY_HOME { background:rgba(248,113,113,.14); color:var(--stay); }
  .b-NO_DATA   { background:rgba(156,163,175,.14); color:var(--nodata); }

  .facts { margin-top:12px; display:flex; flex-direction:column; gap:7px; }
  .fact { display:flex; gap:9px; font-size:.85rem; align-items:baseline; }
  .fact .ico { width:18px; text-align:center; flex:none; }
  .fact .lbl { color:var(--text-dim); flex:none; width:3.2em; }
  .fact .val { flex:1; line-height:1.45; }
  .fact .warn { color:var(--marginal); }

  .chips { display:flex; gap:6px; margin-top:12px; }
  .chip {
    flex:1; text-align:center; border-radius:12px; padding:7px 2px 6px;
    font-size:.7rem; border:1px solid transparent;
  }
  .chip b { display:block; font-size:.82rem; margin-top:1px; }
  .c-好 { background:rgba(52,211,153,.10); color:var(--go); border-color:rgba(52,211,153,.22); }
  .c-中 { background:rgba(251,191,36,.10); color:var(--marginal); border-color:rgba(251,191,36,.22); }
  .c-差 { background:rgba(248,113,113,.10); color:var(--stay); border-color:rgba(248,113,113,.22); }
  .c-無資料 { background:rgba(156,163,175,.08); color:var(--nodata); border-color:rgba(156,163,175,.2); }

  .flags { margin-top:10px; display:flex; flex-direction:column; gap:5px; }
  .flag { font-size:.78rem; padding:7px 10px; border-radius:10px; line-height:1.45; }
  .flag.veto { background:rgba(248,113,113,.10); color:#fca5a5; }
  .flag.cap  { background:rgba(251,191,36,.08); color:#fcd34d; }

  .expand-btn {
    width:100%; margin-top:12px; background:none; border:none; color:var(--accent);
    font-size:.8rem; padding:7px; cursor:pointer; border-top:1px solid var(--card-border);
  }
  .detail { display:none; margin-top:10px; }
  .detail.open { display:block; }
  .detail h3 { font-size:.75rem; color:var(--text-dim); margin:10px 0 6px; letter-spacing:.08em; }
  .htable { overflow-x:auto; border-radius:12px; border:1px solid var(--card-border); }
  table { width:100%; border-collapse:collapse; font-size:.74rem; white-space:nowrap; }
  th, td { padding:7px 8px; text-align:right; }
  th { color:var(--text-dim); font-weight:600; background:rgba(255,255,255,.03); }
  td { border-top:1px solid rgba(255,255,255,.05); }
  td:first-child, th:first-child { text-align:left; }
  tr.best td { background:rgba(125,211,252,.06); }
  .gear { font-size:.8rem; line-height:1.7; color:var(--text); }
  .gear div { padding:2px 0; }
  .src { font-size:.68rem; color:var(--text-dim); margin-top:10px; line-height:1.6; }

  /* ── Error / apology card ── */
  .sorry {
    border:1px solid rgba(248,113,113,.25); background:rgba(248,113,113,.06);
    border-radius:20px; padding:18px; margin-bottom:12px;
  }
  .sorry h2 { font-size:.95rem; color:#fca5a5; }
  .sorry p { font-size:.82rem; color:var(--text-dim); margin-top:6px; line-height:1.55; }

  /* ── Skeleton ── */
  .skel { border-radius:20px; height:150px; margin-bottom:12px;
    background:linear-gradient(90deg, var(--card) 25%, rgba(255,255,255,.09) 50%, var(--card) 75%);
    background-size:200% 100%; animation: shimmer 1.3s infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }

  .foot { text-align:center; font-size:.68rem; color:var(--text-dim); margin-top:18px; line-height:1.8; }
  .stamp { font-size:.7rem; color:var(--text-dim); text-align:right; margin:-6px 2px 10px; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>🌌 銀河儀表板<span class="sub">Rockies Milky Way Scout</span></h1>
    <button class="refresh-btn" id="refreshBtn"><span class="ico">↻</span>更新</button>
  </div>
</header>

<div class="wrap">
  <div class="seg" id="seg">
    <button data-offset="0" class="on">今晚</button>
    <button data-offset="1">聽晚</button>
    <button data-offset="2">後晚</button>
  </div>
  <div class="stamp" id="stamp"></div>
  <div id="hero"></div>
  <div id="cards"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const GRADE_COLOR = { GO:'#34d399', GOOD:'#a3e635', MARGINAL:'#fbbf24', RISKY:'#fb923c', STAY_HOME:'#f87171', NO_DATA:'#9ca3af' };
const GRADE_ZH = { GO:'立即出發', GOOD:'值得去', MARGINAL:'可試有風險', RISKY:'唔太建議', STAY_HOME:'留喺屋企', NO_DATA:'無法評估' };
const LABELS = ['雲','月','煙','風'];
let currentOffset = 0, lastData = null, expanded = new Set();

function dateFor(offset){
  const d = new Date(); d.setDate(d.getDate()+offset);
  return d.toISOString().slice(0,10);
}
function labelOf(s){ return s>=78?'好':(s>=48?'中':'差'); }
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function ringSVG(score, color){
  const r=31, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(100,score||0))/100);
  return `<svg width="74" height="74" viewBox="0 0 74 74">
    <circle cx="37" cy="37" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/>
    <circle cx="37" cy="37" r="${r}" fill="none" stroke="${color}" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}

function chipData(loc){
  // 用建議窗口內嘅小時平均四項指標
  const bw = loc.best_window, hrs = loc.hourly||[];
  let inWin = hrs;
  if (bw) inWin = hrs.filter(h => h.time >= bw.start && h.time < bw.end);
  if (!inWin.length) inWin = hrs;
  const avg = k => inWin.length ? inWin.reduce((a,h)=>a+(h[k]??0),0)/inWin.length : 0;
  const smokeLbl = inWin.some(h=>h.smoke_label==='無資料') ? '無資料' : labelOf(avg('smoke_score'));
  return [
    {n:'雲', l:labelOf(avg('cloud_score')), s:Math.round(avg('cloud_score'))},
    {n:'月', l:labelOf(avg('moon_score')),  s:Math.round(avg('moon_score'))},
    {n:'煙', l:smokeLbl, s:smokeLbl==='無資料'?'—':Math.round(avg('smoke_score'))},
    {n:'風', l:labelOf(avg('wind_score')),  s:Math.round(avg('wind_score'))},
  ];
}

function cardHTML(loc, isBest){
  const g = loc.night.grade_code, color = GRADE_COLOR[g];
  const dw = loc.darkness_window, m = loc.moon, gc = loc.galactic_center;
  const chips = chipData(loc);
  const flags = [
    ...loc.night.vetoes.map(v=>`<div class="flag veto">⛔ ${esc(v)}</div>`),
    ...loc.night.caps.map(c=>`<div class="flag cap">🔒 ${esc(c)}</div>`),
  ].join('');
  const open = expanded.has(loc.location_id);
  const bw = loc.best_window;

  const rows = (loc.hourly||[]).map(h=>{
    const best = bw && h.time>=bw.start && h.time<bw.end;
    return `<tr class="${best?'best':''}">
      <td>${h.time}</td><td>${h.cloud_total_pct}%</td>
      <td>${h.pm2_5??'—'}</td><td>${h.us_aqi??'—'}</td>
      <td>${h.wind_kmh}</td><td>${h.moon_altitude>0?h.moon_altitude+'°':'下'}</td>
      <td><b>${Math.round(h.astro_score)}</b></td>
      <td>${h.cloud_label}/${h.moon_label}/${h.smoke_label}/${h.wind_label}</td></tr>`;
  }).join('');

  return `<div class="card">
    <div class="card-top">
      <div class="ring">${ringSVG(loc.night.score, color)}
        <div class="num"><b style="color:${color}">${g==='NO_DATA'?'—':Math.round(loc.night.score)}</b><span>分</span></div>
      </div>
      <div class="card-title">
        <h2>${isBest?'⭐ ':''}${esc(loc.name_zh)}</h2>
        <div class="mtn">${esc(loc.mountain)}</div>
      </div>
      <span class="badge b-${g}">${GRADE_ZH[g]||g}</span>
    </div>
    ${flags?`<div class="flags">${flags}</div>`:''}
    <div class="facts">
      <div class="fact"><span class="ico">🌑</span><span class="lbl">窗口</span><span class="val">${dw.start} → ${dw.end}
        ${dw.full_astronomical_darkness?'':`<span class="warn">（最深 ${dw.min_sun_altitude}°，冇完整黑夜）</span>`}</span></div>
      <div class="fact"><span class="ico">🌕</span><span class="lbl">月亮</span><span class="val">${Math.round(m.illumination_pct)}% 照明 · ${m.overlap_minutes_in_window===0?'✅ 唔阻':`❌ 重疊 ${m.overlap_minutes_in_window} 分鐘${m.moon_free_periods&&m.moon_free_periods.length?` · 無月 ${m.moon_free_periods.map(p=>p[0]+'→'+p[1]).join('、')}`:''}`}</span></div>
      <div class="fact"><span class="ico">🌌</span><span class="lbl">銀心</span><span class="val">${gc.max_altitude_in_window!=null&&gc.max_altitude_in_window>0?`最高 ${gc.max_altitude_in_window}° @ ${gc.max_altitude_time}（${gc.direction}）${gc.above_10deg_period?'':' · 太貼地平線'}`:'窗口內喺地平線下'}</span></div>
      ${bw?`<div class="fact"><span class="ico">⏱️</span><span class="lbl">建議</span><span class="val">${bw.start} → ${bw.end}</span></div>`:''}
    </div>
    <div class="chips">${chips.map(c=>`<div class="chip c-${c.l}">${c.n}<b>${c.l}${c.s!=='—'?' '+c.s:''}</b></div>`).join('')}</div>
    <button class="expand-btn" onclick="toggle('${loc.location_id}')">${open?'▲ 收埋':'▼ 逐小時 · 器材 · 詳情'}</button>
    <div class="detail ${open?'open':''}">
      ${loc.hourly&&loc.hourly.length?`<h3>逐小時（建議窗口底色）</h3>
      <div class="htable"><table>
        <tr><th>時間</th><th>雲</th><th>PM2.5</th><th>AQI</th><th>風</th><th>月</th><th>分</th><th>雲/月/煙/風</th></tr>${rows}
      </table></div>`:'<p class="gear">冇逐小時數據（可能超出預報範圍）</p>'}
      <h3>器材保護（全晚）</h3>
      <div class="gear">${(loc.gear_advice||[]).map(g=>`<div>${esc(g)}</div>`).join('')}</div>
      <div class="src">座標 ${loc.lat}, ${loc.lon} · ${esc(loc.coord_source)}<br>${esc(loc.sources?.weather||'')}<br>${esc(loc.sources?.air_quality||'')}<br>${esc(loc.sources?.astronomy||'')}</div>
    </div>
  </div>`;
}

function sorryHTML(loc){
  return `<div class="sorry">
    <h2>🙇 對唔住 — ${esc(loc.name_zh||loc.location_id)} 而家分析唔到</h2>
    <p>${esc(loc.message||'未知原因')}</p>
    <p style="margin-top:8px;font-size:.75rem">我唔會俾假數據你。可以稍後撳「更新」再試一次。</p>
  </div>`;
}

function heroHTML(data){
  const ok = data.locations.filter(l=>!l.error && l.night.grade_code!=='NO_DATA');
  if (!ok.length) return `<div class="hero"><div class="k">今晚結論</div><div class="v">🙇 分析唔到</div><div class="why">全部機位都攞唔到數據，我唔會靠估。請睇下面各機位嘅失敗原因，或者稍後再更新。</div></div>`;
  const best = ok.find(l=>l.location_id===data.best_location_id) || ok[0];
  const g = best.night.grade_code;
  if (['GO','GOOD'].includes(g))
    return `<div class="hero"><div class="k">今晚結論</div><div class="v" style="color:${GRADE_COLOR[g]}">⭐ ${esc(best.name_zh)} — ${GRADE_ZH[g]}（${Math.round(best.night.score)} 分）</div><div class="why">窗口 ${best.darkness_window.start} → ${best.darkness_window.end}${best.best_window?`，建議 ${best.best_window.start} → ${best.best_window.end}`:''}。出門前睇一眼逐小時同器材建議。</div></div>`;
  const why = best.night.vetoes[0] || best.night.caps[0] || '條件一般';
  return `<div class="hero"><div class="k">今晚結論</div><div class="v" style="color:${GRADE_COLOR[g]}">${GRADE_ZH[g]} — 最好都係 ${esc(best.name_zh)}（${Math.round(best.night.score)} 分）</div><div class="why">${esc(why)}</div></div>`;
}

function render(data){
  lastData = data;
  document.getElementById('hero').innerHTML = heroHTML(data);
  const ok = data.locations.filter(l=>!l.error).sort((a,b)=>b.night.score-a.night.score);
  const bad = data.locations.filter(l=>l.error);
  document.getElementById('cards').innerHTML =
    ok.map(l=>cardHTML(l, l.location_id===data.best_location_id)).join('') +
    bad.map(sorryHTML).join('');
  const age = data.cache_age_seconds ? `（cache ${data.cache_age_seconds}s）` : '';
  const modeTag = data._mode==='static' ? '☁️ 每小時自動更新' : '⚡ 即時分析';
  document.getElementById('stamp').textContent = `${modeTag} · 數據：${data.generated_at} ${age} · 分析用時 ${data.elapsed_seconds}s`;
  document.getElementById('foot').innerHTML =
    `雲45% · 月25% · 煙20% · 風10%（倒影）<br>Open-Meteo · CAMS · skyfield — 只用機位本身座標`;
}

function loading(){
  document.getElementById('hero').innerHTML = '';
  document.getElementById('cards').innerHTML = '<div class="skel"></div>'.repeat(6);
  document.getElementById('stamp').textContent = '正在即時分析六個機位（約 10–20 秒）…';
}

async function load(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  loading();
  try {
    let data = null;
    // 先試 LAN live API；失敗就試靜態 JSON（GitHub Pages 模式）
    try {
      const r = await fetch('/api/report?date='+dateFor(currentOffset));
      if (!r.ok) throw new Error('HTTP '+r.status);
      data = await r.json();
      data._mode = 'live';
    } catch(e1) {
      const r2 = await fetch('report-'+currentOffset+'.json?_='+Date.now());
      if (!r2.ok) throw new Error('靜態數據都冇（HTTP '+r2.status+'）');
      data = await r2.json();
      data._mode = 'static';
    }
    render(data);
  } catch(e) {
    document.getElementById('hero').innerHTML = `<div class="sorry"><h2>🙇 對唔住，攞唔到數據</h2><p>${esc(e.message)}</p><p style="margin-top:8px;font-size:.75rem">我唔會俾假數據你。請檢查網絡，或者稍後再撳更新。</p></div>`;
    document.getElementById('cards').innerHTML = '';
  } finally {
    btn.classList.remove('spinning');
  }
}

function toggle(id){
  expanded.has(id) ? expanded.delete(id) : expanded.add(id);
  if (lastData) render(lastData);
}

document.getElementById('seg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  currentOffset = +b.dataset.offset;
  load();
});
document.getElementById('refreshBtn').addEventListener('click', load);
load();
setInterval(load, 600000);
</script>
</body>
</html>
